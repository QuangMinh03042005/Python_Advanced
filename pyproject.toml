[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".python",
    ".tools",
    ".hf-cache",
    ".uv-cache",
    ".tmp",
    "data",
    "models",
    "runs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:cacheprovider"
